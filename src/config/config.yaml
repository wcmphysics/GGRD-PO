# Stages run in this order. Enable any combination that has the required input files.
# Paths are relative to the repository root. Predict and optimize may reuse an existing bundle.
# Train-only expects data/pseudo_data.csv. Enable generate for a fresh synthetic demo.
generate:
  enabled: false
  config: src/config/pseudo_data_config.yaml
train:
  enabled: true
  config: src/config/train_demo.yaml
predict:
  enabled: false
  config: src/config/predict_demo.yaml
optimize:
  enabled: false
  config: src/config/optimize_free_demo.yaml  # Or src/config/optimize_fixed_demo.yaml.
